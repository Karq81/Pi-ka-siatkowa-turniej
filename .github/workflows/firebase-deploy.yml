# Builds the site and publishes it on Firebase Hosting (sportlivearena.com), together with
# the Firestore and Realtime Database access rules, on every push to the production branch.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google Cloud
# service account of the project with the roles Firebase Admin, API Keys Viewer and
# Service Usage Consumer. Without the secret the deploy step is skipped.
# The AI assistant (Cloud Functions, needs the Blaze plan) is deployed only when the
# repository secret ANTHROPIC_API_KEY is set too; the service account then also needs the
# role Service Account User.
name: Firebase deploy

on:
  push:
    branches: [claude/volleyball-tournament-online-lzfmrb]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Firebase Hosting and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, skipping the deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore:rules --project turniej-siatkowki-faf22 --non-interactive
      - name: Deploy the Realtime Database rules (live scores)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then exit 0; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # Needs the Realtime Database to exist (Firebase console → Realtime Database →
          # Create database, location Belgium). Until then the site keeps live scores in Firestore.
          npx firebase deploy --only database --project turniej-siatkowki-faf22 --non-interactive \
            || echo "::warning::Realtime Database rules not deployed. Create the Realtime Database in the Firebase console (Belgium, europe-west1)."
      - name: Deploy the AI assistant (Cloud Functions)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set, the AI assistant is not deployed."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > functions/.env
          (cd functions && npm ci)
          npx firebase deploy --only functions --project turniej-siatkowki-faf22 --non-interactive --force
